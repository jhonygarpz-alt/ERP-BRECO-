];

const TOTAL_UNIDADES = 28;

function initialRows() {
  return Array.from({ length: TOTAL_UNIDADES }, (_, i) => ({
    unidad: `ECO ${i + 1}`,
    ubicacion: "",
    status: "En tránsito",
    cliente: "",
  }));
}

function statusInfo(label) {
  return STATUS_OPTIONS.find((s) => s.label === label) || STATUS_OPTIONS[0];
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function formatTime(d) {
  return d.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function formatDateLong(d) {
  const s = d.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function formatFileStamp(d) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}

// --- Iconos simples en SVG (sin dependencias externas) ---

    <svg viewBox="0 0 24 24" width={props.size || 20} height={props.size || 20} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="10" />

    </svg>
  );
}
function IconTruck(props) {

    <svg viewBox="0 0 24 24" width={props.size || 20} height={props.size || 20} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

      <polygon points="16 8 20 8 23 11 23 16 16 16 16 8" />

      <circle cx="18.5" cy="18.5" r="2.5" />

}
function IconCamera(props) {
  return (
    <svg viewBox="0 0 24 24" width={props.size || 20} height={props.size || 20} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
      <circle cx="12" cy="13" r="4" />
    </svg>

}
function IconDownload(props) {
  return (
    <svg viewBox="0 0 24 24" width={props.size || 18} height={props.size || 18} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

}
function IconReset(props) {
  return (
    <svg viewBox="0 0 24 24" width={props.size || 16} height={props.size || 16} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="1 4 1 10 7 10" />
      <path d="M3.51 15a9 9 0 1 0 .49-6.36L1 10" />
    </svg>

}

function EstatusTLAAV() {
  const [rows, setRows] = useState(initialRows());
  const [now, setNow] = useState(new Date());
  const [lastCapture, setLastCapture] = useState(null);
  const [previewImg, setPreviewImg] = useState(null);
  const [generating, setGenerating] = useState(false);

  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);

  function updateRow(index, field, value) {
    setRows((prev) => prev.map((r, i) => (i === index ? { ...r, [field]: value } : r)));
  }

  function resetAll() {
    if (window.confirm('¿Limpiar todos los campos de ubicación y cliente? El status volverá a "En tránsito".')) {
      setRows(initialRows());
    }
  }

  const minutesSinceCapture = lastCapture ? Math.floor((now - lastCapture) / 60000) : null;
  const isOverdue = minutesSinceCapture !== null && minutesSinceCapture >= 120;

  async function generateImage() {
    setGenerating(true);
    try {
      const width = 960;
      const rowHeight = 34;
      const headerHeight = 190;
      const tableHeaderHeight = 44;
      const footerHeight = 56;
      const height = headerHeight + tableHeaderHeight + rows.length * rowHeight + footerHeight;

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, width, height);

      const grad = ctx.createLinearGradient(0, 0, width, 0);
      grad.addColorStop(0, "#D84315");
      grad.addColorStop(1, "#F4511E");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, headerHeight);

      try {
        const logoImg = await loadImage(LOGO_B64);
        const logoW = 150;
        const logoH = (logoW * logoImg.height) / logoImg.width;
        ctx.drawImage(logoImg, 26, (headerHeight - logoH) / 2, logoW, logoH);
      } catch (e) {}

      ctx.fillStyle = "#FFFFFF";
      ctx.textAlign = "left";
      ctx.font = "bold 27px Arial";
      ctx.fillText("ACTUALIZACIÓN DE ESTATUS", 200, 68);
      ctx.font = "16px Arial";
      ctx.globalAlpha = 0.92;
      ctx.fillText("Barrido diario · Flota TLAAV", 200, 96);
      ctx.globalAlpha = 1;

      ctx.textAlign = "right";
      ctx.font = "bold 30px Arial";
      ctx.fillText(formatTime(now), width - 26, 68);
      ctx.font = "14px Arial";
      ctx.fillText(formatDateLong(now), width - 26, 92);
      ctx.font = "12px Arial";
      ctx.globalAlpha = 0.85;
      ctx.fillText("Actualización cada 2 horas", width - 26, 112);
      ctx.globalAlpha = 1;
      ctx.textAlign = "left";

      let y = headerHeight;
      ctx.fillStyle = "#1F2937";
      ctx.fillRect(0, y, width, tableHeaderHeight);
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 14px Arial";
      const colX = [26, 160, 470, 660];
      ctx.fillText("UNIDAD", colX[0], y + 27);
      ctx.fillText("UBICACIÓN ACTUAL", colX[1], y + 27);
      ctx.fillText("STATUS ACTUAL", colX[2], y + 27);
      ctx.fillText("CLIENTE", colX[3], y + 27);
      y += tableHeaderHeight;

      rows.forEach((r, i) => {
        ctx.fillStyle = i % 2 === 0 ? "#FFF3EC" : "#FFFFFF";
        ctx.fillRect(0, y, width, rowHeight);
        ctx.strokeStyle = "#F0E0D6";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y + rowHeight);
        ctx.lineTo(width, y + rowHeight);
        ctx.stroke();

        ctx.fillStyle = "#D84315";
        ctx.font = "bold 13px Arial";
        ctx.fillText(r.unidad, colX[0], y + 22);

        ctx.fillStyle = "#1F2937";
        ctx.font = "13px Arial";
        const ubic = r.ubicacion && r.ubicacion.trim() ? r.ubicacion : "—";
        ctx.fillText(ubic.length > 34 ? ubic.slice(0, 33) + "…" : ubic, colX[1], y + 22);

        const info = statusInfo(r.status);
        ctx.fillStyle = info.bg;
        roundRect(ctx, colX[2] - 8, y + 6, 172, 22, 11);
        ctx.fill();
        ctx.fillStyle = info.color;
        ctx.font = "bold 12px Arial";
        ctx.fillText(r.status, colX[2] + 2, y + 21);

        ctx.fillStyle = "#1F2937";
        ctx.font = "13px Arial";
        const cli = r.cliente && r.cliente.trim() ? r.cliente : "—";
        ctx.fillText(cli.length > 26 ? cli.slice(0, 25) + "…" : cli, colX[3], y + 22);

        y += rowHeight;
      });

      ctx.fillStyle = "#D84315";
      ctx.fillRect(0, y, width, footerHeight);
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "13px Arial";
      ctx.fillText("Transportes Vázquez (TLAAV)  ·  Centro de Monitoreo", 26, y + 34);
      ctx.textAlign = "right";
      ctx.font = "12px Arial";
      ctx.globalAlpha = 0.9;
      ctx.fillText(`Generado: ${formatTime(now)} · ${formatDateLong(now)}`, width - 26, y + 34);
      ctx.globalAlpha = 1;

      const dataUrl = canvas.toDataURL("image/png");
      setPreviewImg(dataUrl);
      setLastCapture(new Date());

      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = `Estatus_TLAAV_${formatFileStamp(new Date())}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    } finally {
      setGenerating(false);
    }
  }

  return (
    <div className="min-h-screen relative" style={{ backgroundColor: "#FFF7F2" }}>
      <div
        className="fixed inset-0 bg-cover bg-center opacity-15"
        style={{ backgroundImage: `url(${TRAILER_B64})` }}
      />
      <div className="relative max-w-5xl mx-auto px-3 sm:px-6 py-5">
        <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-orange-100">
          <div
            className="px-5 sm:px-8 py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"
            style={{ background: "linear-gradient(135deg, #D84315, #F4511E)" }}
          >
            <div className="flex items-center gap-4">
              <img src={LOGO_B64} alt="TLAAV" className="h-14 sm:h-16 w-auto drop-shadow" />
              <div>
                <h1 className="text-white font-bold text-lg sm:text-2xl leading-tight">
                  Actualización de Estatus
                </h1>
                <p className="text-orange-50 text-sm sm:text-base opacity-90">
                  Barrido diario · Flota TLAAV
                </p>
              </div>
            </div>
            <div className="flex items-center gap-2 bg-black/15 rounded-xl px-4 py-2 self-start sm:self-auto">
              <IconClock size={22} />
              <div className="text-white">
                <div className="font-mono font-bold text-xl sm:text-2xl leading-none tabular-nums">
                  {formatTime(now)}
                </div>
                <div className="text-[11px] sm:text-xs opacity-90 mt-0.5">{formatDateLong(now)}</div>
              </div>
            </div>
          </div>

          <div className="px-5 sm:px-8 py-3 bg-orange-50 border-b border-orange-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-sm">
            <div className="flex items-center gap-2 text-orange-900">
              <IconTruck size={16} />
              <span>Actualizar cada 2 horas · {TOTAL_UNIDADES} unidades (ECO 1 – ECO {TOTAL_UNIDADES})</span>
            </div>
            <div className={`font-medium ${isOverdue ? "text-red-600" : "text-orange-700"}`}>
              {lastCapture
                ? `Última captura: ${formatTime(lastCapture)} (hace ${minutesSinceCapture} min)${isOverdue ? " — ¡actualizar!" : ""}`
                : "Aún sin captura en este turno"}
            </div>
          </div>

          <div className="overflow-x-auto">
            <table className="w-full min-w-[720px] text-sm">
              <thead>
                <tr style={{ backgroundColor: "#1F2937" }}>
                  <th className="text-white text-left font-semibold px-4 py-3 w-24">UNIDAD</th>
                  <th className="text-white text-left font-semibold px-4 py-3">UBICACIÓN ACTUAL</th>
                  <th className="text-white text-left font-semibold px-4 py-3 w-48">STATUS ACTUAL</th>
                  <th className="text-white text-left font-semibold px-4 py-3 w-52">CLIENTE</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => {
                  const info = statusInfo(r.status);
                  return (
                    <tr key={r.unidad} className={i % 2 === 0 ? "bg-orange-50/60" : "bg-white"}>
                      <td className="px-4 py-2 font-bold" style={{ color: "#D84315" }}>
                        {r.unidad}
                      </td>
                      <td className="px-2 py-1.5">
                        <input
                          type="text"
                          value={r.ubicacion}
                          onChange={(e) => updateRow(i, "ubicacion", e.target.value)}
                          placeholder="Ej. Puebla, MEX-CDMX km 120"
                          className="w-full px-2 py-1.5 rounded-md border border-gray-200 focus:border-orange-400 focus:ring-1 focus:ring-orange-300 text-gray-800 placeholder-gray-400"
                        />
                      </td>
                      <td className="px-2 py-1.5">
                        <select
                          value={r.status}
                          onChange={(e) => updateRow(i, "status", e.target.value)}
                          className="w-full px-2 py-1.5 rounded-md border-none font-semibold focus:ring-1 focus:ring-orange-300"
                          style={{ backgroundColor: info.bg, color: info.color }}
                        >
                          {STATUS_OPTIONS.map((s) => (
                            <option key={s.label} value={s.label}>
                              {s.label}
                            </option>
                          ))}
                        </select>
                      </td>
                      <td className="px-2 py-1.5">
                        <input
                          type="text"
                          value={r.cliente}
                          onChange={(e) => updateRow(i, "cliente", e.target.value)}
                          placeholder="Nombre del cliente"
                          className="w-full px-2 py-1.5 rounded-md border border-gray-200 focus:border-orange-400 focus:ring-1 focus:ring-orange-300 text-gray-800 placeholder-gray-400"
                        />
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          <div className="px-5 sm:px-8 py-4 bg-white border-t border-orange-100 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
            <button
              onClick={resetAll}
              className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 text-gray-600 hover:bg-gray-50 transition text-sm font-medium"
            >
              <IconReset size={16} />
              Limpiar barrido
            </button>
            <button
              onClick={generateImage}
              disabled={generating}
              className="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl text-white font-bold shadow-lg hover:shadow-xl active:scale-[0.98] transition disabled:opacity-60"
              style={{ background: "linear-gradient(135deg, #D84315, #F4511E)" }}
            >
              <IconCamera size={20} />
              {generating ? "Generando…" : "Capturar y compartir"}
            </button>
          </div>
        </div>

        {previewImg && (
          <div className="mt-5 bg-white rounded-2xl shadow-xl border border-orange-100 p-4 sm:p-6">
            <div className="flex items-center justify-between mb-3">
              <h2 className="font-bold text-gray-800 flex items-center gap-2">
                <IconDownload size={18} />
                Imagen lista para compartir
              </h2>
              <a
                href={previewImg}
                download={`Estatus_TLAAV_${formatFileStamp(now)}.png`}
                className="text-sm font-semibold px-3 py-1.5 rounded-lg text-white"
                style={{ backgroundColor: "#D84315" }}
              >
                Descargar de nuevo
              </a>
            </div>
            <p className="text-xs text-gray-500 mb-3">
              Si la descarga automática no inició, mantén presionada la imagen (celular) o haz clic derecho → Guardar imagen (computadora) para compartirla en tus grupos.
            </p>
            <img
              src={previewImg}
              alt="Estatus TLAAV generado"
              className="w-full rounded-lg border border-gray-200"
            />
          </div>
        )}

        <p className="text-center text-xs text-orange-900/60 mt-4 pb-4">
          Transportes Vázquez (TLAAV) · Centro de Monitoreo · Uso interno
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<EstatusTLAAV />);
</script>
</body>
</html>
